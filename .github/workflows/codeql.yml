name: CodeQL

# Security analysis of the code. The program is really compiled (build.cmd), so CodeQL knows every type
# used: without a build it cannot find Windows Forms and reports "Low C# analysis quality".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # every Monday morning

jobs:
  analyze:
    name: Analisi C#
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      # "< NUL" lets build.cmd continue past the final "pause".
      - name: Compila
        shell: cmd
        run: build.cmd < NUL

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
