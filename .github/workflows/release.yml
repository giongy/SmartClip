name: Release

# Publishes SmartClip.exe as a GitHub release whenever the version number changes: the number is the
# AssemblyVersion line of src/Program.cs, and a release is created only if none carries it yet. So a
# release is made by changing that line and pushing; every other push only runs the checks. Each release
# also leaves the Microsoft Store package (MSIX) among the artifacts of the run; started by hand, the
# workflow makes the package even when the release exists already.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.cmd"
      - "SmartClip.ico"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  release:
    name: Pubblica
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # The automated checks, at every push: a release is never made from code that fails them. The typing test
      # is left out, as it needs a desktop to type into.
      - name: Controlla
        shell: cmd
        run: tests\test.cmd ci

      # 2.1.0.0 in the source becomes the tag v2.1.0, and 2.1.0.1 the tag v2.1.0.1: the fourth number counts
      # only when it is not zero, as in the title of the window.
      - name: Legge la versione
        id: version
        shell: pwsh
        run: |
          $found = Select-String -Path src/Program.cs -Pattern 'AssemblyVersion\("(\d+\.\d+\.\d+)(\.\d+)?"\)'
          if (-not $found) { throw "AssemblyVersion not found in src/Program.cs" }
          $groups = $found.Matches[0].Groups
          $tag = "v" + $groups[1].Value + $(if ($groups[2].Value -ne ".0") { $groups[2].Value })
          gh release view $tag *> $null
          $publish = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "$tag, to publish: $publish"
          exit 0

      # "< NUL" lets build.cmd continue past the final "pause". Started by hand, the workflow also builds
      # when the release exists already: to get the Store package.
      - name: Compila
        if: steps.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        shell: cmd
        run: build.cmd < NUL

      # The MSIX for Partner Center, among the artifacts of the run rather than on the release: unsigned, it
      # installs nowhere until the Store signs it.
      - name: Crea il pacchetto per lo Store
        if: steps.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./packaging/pack.ps1

      - name: Carica il pacchetto per lo Store
        if: steps.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: SmartClip-msix
          path: packaging/out/*.msix
          if-no-files-found: error

      - name: Crea la release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: gh release create ${{ steps.version.outputs.tag }} SmartClip.exe --target ${{ github.sha }} --title "SmartClip ${{ steps.version.outputs.tag }}" --generate-notes
